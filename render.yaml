# Render Blueprint for the email existence check.
#
# Render blocks outbound port 25, so /validate checks syntax and MX only
# unless a SOCKS5 proxy is set. Send when safe_to_send is true. Skip when
# would_bounce is true (bad syntax or no mail server).
services:
  - type: web
    name: email-validator
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: reacher=info
      - key: RCH__HTTP_HOST
        value: 0.0.0.0
      - key: RCH__WORKER__ENABLE
        value: "false"
      - key: RCH__SMTP_TIMEOUT
        value: "15"
      - key: RCH__BACKEND_NAME
        value: render
      - key: RCH_ENABLE_CHROMEDRIVER
        value: "false"
